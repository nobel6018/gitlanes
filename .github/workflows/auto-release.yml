name: Auto Release

# main에 들어온 커밋의 package.json 버전에 해당하는 태그가 아직 없으면 태그를 만들고 릴리스한다.
# 버전을 올린 release/vX PR을 머지하는 것만으로 태그와 릴리스가 따라온다.
# 버전이 그대로인 머지는 태그가 이미 있어서 건너뛴다.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

# 연달아 머지돼도 같은 태그를 두 번 만들지 않게 한 줄로 세운다
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # 원격을 직접 본다. 사람이 먼저 태그를 푸시했으면 그쪽 Release 실행에 맡긴다
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists, skip"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN으로 푸시한 태그는 release.yml의 태그 트리거를 깨우지 못해서 직접 호출한다
  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
