name: Release

# 두 경로로 실행된다. 태그를 직접 푸시하거나, auto-release.yml이 버전 변경을 보고 태그를 만든 뒤 호출한다.
# GITHUB_TOKEN으로 푸시한 태그는 이 워크플로를 깨우지 못해서 호출 경로가 따로 필요하다.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: 릴리스할 태그 (예 v0.21.0). 이미 원격에 있어야 한다
        required: true
        type: string

env:
  # 호출 경로에서는 github.ref_name이 호출한 쪽 브랜치(main)라서 입력값을 쓴다
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # 태그 형태로 빌드 범위를 정한다:
  #   v1.2.3       → macOS universal + Linux + Windows, 정식 릴리스
  #   v1.2.3-rc.1  → macOS universal만, 프리릴리스 (하이픈이 기준)
  # macOS는 인텔 러너(macos-13, 사실상 은퇴로 대기열 무한) 대신
  # arm 러너에서 universal 바이너리(arm64+x86_64)를 크로스 빌드한다.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
      title: ${{ steps.notes.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # 직전 태그까지 거슬러 릴리스 노트를 만든다

      # 릴리스 노트: 변경 목록(PR/커밋 링크), 버전·커밋·시간, 받을 파일, 첫 실행 안내
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(.github/scripts/release-notes.sh "${TAG}" "${GITHUB_REPOSITORY}")"
          {
            echo "notes<<GL_NOTES_EOF"
            echo "$body"
            echo "GL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "title=GitLanes ${TAG} · $(TZ=Asia/Seoul date '+%Y-%m-%d') ($(git rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"

      # 태그와 매니페스트 버전이 어긋나면(과거 sed 누락 사고) 여기서 멈춘다
      - name: Verify tag matches manifest version
        run: |
          want="${TAG#v}"
          for f in package.json src-tauri/tauri.conf.json; do
            got="$(grep -m1 '"version"' "$f" | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
            [ "$got" = "$want" ] || { echo "::error::$f has $got, tag is $want"; exit 1; }
          done
          cargo_got="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [ "$cargo_got" = "$want" ] || { echo "::error::Cargo.toml has $cargo_got, tag is $want"; exit 1; }
          echo "version ok: $want"

      - id: set
        run: |
          if [[ "${TAG}" == *-* ]]; then
            echo 'matrix=[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]' >> "$GITHUB_OUTPUT"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""}]' >> "$GITHUB_OUTPUT"
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # shared-key를 ci.yml의 dev-build와 맞춰 main에서 데운 캐시를 재사용한다
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Run frontend typecheck and Rust tests
        run: |
          npx tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: ${{ needs.plan.outputs.title }}
          releaseBody: ${{ needs.plan.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          args: ${{ matrix.args }}
