name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 태그 형태로 빌드 범위를 정한다:
  #   v1.2.3       → macOS universal + Linux + Windows, 정식 릴리스
  #   v1.2.3-rc.1  → macOS universal만, 프리릴리스 (하이픈이 기준)
  # macOS는 인텔 러너(macos-13, 사실상 은퇴로 대기열 무한) 대신
  # arm 러너에서 universal 바이너리(arm64+x86_64)를 크로스 빌드한다.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      prerelease: ${{ steps.set.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
      title: ${{ steps.notes.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 직전 태그까지 거슬러 릴리스 노트를 만든다

      # 릴리스 노트: 변경 목록(PR/커밋 링크), 버전·커밋·시간, 받을 파일, 첫 실행 안내
      - id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(.github/scripts/release-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}")"
          {
            echo "notes<<GL_NOTES_EOF"
            echo "$body"
            echo "GL_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "title=GitLanes ${GITHUB_REF_NAME} · $(TZ=Asia/Seoul date '+%Y-%m-%d') ($(git rev-parse --short HEAD))" >> "$GITHUB_OUTPUT"

      - id: set
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo 'matrix=[{"platform":"macos-latest","args":"--target universal-apple-darwin"}]' >> "$GITHUB_OUTPUT"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=[{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""}]' >> "$GITHUB_OUTPUT"
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # shared-key를 ci.yml의 dev-build와 맞춰 main에서 데운 캐시를 재사용한다
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Run frontend typecheck and Rust tests
        run: |
          npx tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ needs.plan.outputs.title }}
          releaseBody: ${{ needs.plan.outputs.notes }}
          releaseDraft: false
          prerelease: ${{ needs.plan.outputs.prerelease }}
          args: ${{ matrix.args }}
