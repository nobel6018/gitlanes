[package]
name = "gitlanes"
version = "0.13.6"
description = "GitKraken-style read-only commit graph viewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# v0.16에서 읽기 전용으로 되돌렸다. ops.rs의 쓰기 command는 코드와 테스트를 남겨 두고
# 이 기능을 켤 때만 `#[tauri::command]`로 노출된다. 기본 빌드에서는 프론트가 부를 수 없다.
[features]
write-ops = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 창 크기·위치를 종료 시 저장하고 다음 실행에 복원한다.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"

# macOS 전용: muda가 Shift 조합 accelerator에 소문자 keyEquivalent를 넣어
# AppKit이 ⇧⌘W를 매칭하지 못한다. 메뉴 설치 후 직접 대문자로 고치려고 쓴다.
# 세 크레이트 모두 tauri/muda가 이미 끌고 오는 것이라 새로 받아오는 의존성은 없다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
