[package]
name = "gitlanes"
version = "0.8.1"
description = "GitKraken-style read-only commit graph viewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS 전용: muda가 Shift 조합 accelerator에 소문자 keyEquivalent를 넣어
# AppKit이 ⇧⌘W를 매칭하지 못한다. 메뉴 설치 후 직접 대문자로 고치려고 쓴다.
# 세 크레이트 모두 tauri/muda가 이미 끌고 오는 것이라 새로 받아오는 의존성은 없다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
