[package]
name = "gitlanes"
version = "0.18.0"
description = "GitKraken-style commit graph viewer and git client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 창 크기·위치를 종료 시 저장하고 다음 실행에 복원한다.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
# git을 기다리는 실행기가 block_in_place로 tokio 워커를 내놓는다(src/blocking.rs).
# tauri가 같은 기능으로 이미 끌고 오는 크레이트라 새로 받아오는 의존성은 없다.
tokio = { version = "1", features = ["rt-multi-thread"] }

# 유닉스 전용: 타임아웃 때 git이 띄운 프로세스 그룹 전체를 죽이는 killpg.
# tauri가 이미 끌고 오는 크레이트라 새로 받아오는 의존성은 없다.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS 전용: muda가 Shift 조합 accelerator에 소문자 keyEquivalent를 넣어
# AppKit이 ⇧⌘W를 매칭하지 못한다. 메뉴 설치 후 직접 대문자로 고치려고 쓴다.
# 세 크레이트 모두 tauri/muda가 이미 끌고 오는 것이라 새로 받아오는 의존성은 없다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
